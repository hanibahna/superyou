# Native SuperYou iPhone app (SwiftUI). Generate the Xcode project with:  brew install xcodegen && xcodegen
name: SuperYou
options:
  bundleIdPrefix: com.shopsuperyou
  deploymentTarget: { iOS: "17.0" }
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 11.0.0
targets:
  SuperYou:
    type: application
    platform: iOS
    sources: [Sources, Resources]
    dependencies:
      - package: Firebase
        product: FirebaseMessaging
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shopsuperyou.app
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: Resources/SuperYou.entitlements
        SWIFT_VERSION: "5.0"
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: SuperYou
        UILaunchScreen: { UIColorName: "", UIImageName: "" }
        UIBackgroundModes: [remote-notification]
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        LSApplicationQueriesSchemes: [whatsapp]
